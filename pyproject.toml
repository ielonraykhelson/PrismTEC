[project]
name = "PrismTEC"
version = "0.0.9"
description = "PrismTEC: Threat Enrichment and Correlation Engine"
authors = [{name="Ielon Raykhelson"}]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
prismtec = "prismtec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
