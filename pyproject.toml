[project]
name = "PrismTEC"
version = "1.0.1"
description = "PrismTEC: Threat Enrichment and Correlation Engine"
authors = [{name="Ielon Raykhelson"}]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "ipinfo>=5.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
prismtec = "prismtec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
